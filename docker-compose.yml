# Local Postgres for development and tests. Production uses Supabase instead.
# Start it with: docker compose up -d db
services:
  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: boilerpitch
      POSTGRES_PASSWORD: boilerpitch
      POSTGRES_DB: boilerpitch
    volumes:
      # Keeps your local data when the container is stopped or recreated.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boilerpitch -d boilerpitch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
